<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SlotPSX</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07041a; color: #efeaff; font: 15px 'Chakra Petch', system-ui, sans-serif; }
    main { padding: 24px 16px; max-width: 640px; }
    h1 { font: 40px Bungee, Impact, sans-serif; margin: 0 0 8px; } h1 span { color: #ffd23e; }
    p { color: #9a8fc4; }
    .games { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 20px; }
    a { display: block; padding: 18px; border-radius: 14px; background: #120b2e; border: 2px solid #3a2a7a; color: inherit; text-decoration: none; }
    a b { font: 24px Bungee, Impact, sans-serif; display: block; } a:hover { border-color: #ffd23e; }
  </style>
</head>
<body>
  <main>
    <h1>SLOT<span>PSX</span></h1>
    <p>Página de desarrollo. Son dos slots independientes, cada una con su URL y su bundle.</p>
    <div class="games">
      <a href="duelo/"><b>DUELO</b>Estilo Wanted: formas y duelos VS</a>
      <a href="olimpo/"><b>OLIMPO</b>Estilo Gates: cascadas y orbes</a>
    </div>
  </main>
</body>
</html>
